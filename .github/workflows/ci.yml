name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install
        working-directory: server
        run: npm ci
      - name: Signaling server tests
        working-directory: server
        run: npm test

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Accept SDK licenses and install platform
        run: |
          # The ubuntu runner image ships the Android SDK (ANDROID_HOME).
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Domain unit tests
        run: |
          set -o pipefail
          gradle :domain:test --stacktrace 2>&1 | tee domain-test.log

      - name: Assemble debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Lint (non-blocking)
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:lintDebug 2>&1 | tee lint.log

      - name: Optional Health Connect build (non-blocking)
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:compileDebugKotlin -PhealthConnect=true 2>&1 | tee health-connect.log

      - name: Summarize failures
        if: always()
        run: |
          # Prints compiler errors as annotations so they can be read without signing in.
          for f in build.log domain-test.log health-connect.log; do scripts/ci-summarize.sh "$f"; done

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: walk-buddy-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-and-logs
          path: |
            *.log
            domain/build/reports/
            domain/build/test-results/
            app/build/reports/
          if-no-files-found: ignore

  # Renders every main screen to PNG with Paparazzi (JVM, no emulator) so the UI can be reviewed without a phone.
  # Separate from the `android` job and allowed to fail: it never blocks the green build.
  # Uploads the PNGs as an artifact and force-pushes them (a tiny orphan commit, overwritten each run) to the
  # `ci-screenshots` branch, so they can be fetched with plain `git fetch origin ci-screenshots`.
  screenshots:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Accept SDK licenses and install platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Render screenshots (Paparazzi)
        run: |
          set -o pipefail
          gradle :app:recordPaparazziDebug --stacktrace 2>&1 | tee shots.log

      - name: Summarize failures
        if: always()
        run: scripts/ci-summarize.sh shots.log

      - name: Collect PNGs
        if: always()
        run: |
          mkdir -p out
          for f in app/src/test/snapshots/images/*.png; do
            [ -f "$f" ] || continue
            cp "$f" "out/$(basename "$f" | sed -E 's/^.*Test_//')"
          done
          ls -la out

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            out/*.png
            shots.log
            app/build/reports/tests/
          if-no-files-found: ignore

      - name: Publish to ci-screenshots branch
        if: always() && hashFiles('out/*.png') != ''
        run: |
          cd out
          git init -q -b ci-screenshots
          git config user.name "ci-screenshots"
          git config user.email "ci-screenshots@users.noreply.github.com"
          echo "Rendered by CI run ${GITHUB_RUN_ID} from ${GITHUB_SHA}" > README.txt
          git add -A
          git commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-screenshots
